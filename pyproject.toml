[project]
name = "music-research-agent"
version = "0.1.0"
description = "Source-cited A&R screening reports on emerging artists"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0"]

[project.scripts]
music-research-agent = "music_research_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_research_agent"]
